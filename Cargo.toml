[package]
name = "zhku-netautoauth-gui"
version = "2.3.0"
edition = "2024"
license = "MIT"
description = "白云校区校园网自动认证 Windows 桌面客户端"
publish = false

[dependencies]
eframe = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "charset"] }
serde_json = "1"
regex = "1"
zeroize = "1"
tempfile = "3"
semver = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
tray-icon = "0.21"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
