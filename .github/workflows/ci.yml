name: Desktop checks

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build and test frontend
        run: npm run test:ui
      - name: Check formatting
        run: cargo fmt --check
      - name: Check Rust code
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked
      - name: Check Tauri formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - name: Check Tauri code
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test shared core with Tauri dependencies
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked -p zhku-netautoauth-gui --lib
      - name: Build Tauri client
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --features custom-protocol
