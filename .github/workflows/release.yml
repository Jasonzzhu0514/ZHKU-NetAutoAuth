name: Windows desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
          (Join-Path ${env:ProgramFiles(x86)} 'NSIS') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Test and build desktop executable
        shell: pwsh
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: ./scripts/build.ps1 -ReleaseTag $env:RELEASE_TAG
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64
          path: |
            dist/ZHKU-NetAutoAuth.exe
            dist/ZHKU-NetAutoAuth-Setup.exe
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          & gh release create $env:RELEASE_TAG ./dist/ZHKU-NetAutoAuth-Setup.exe ./dist/ZHKU-NetAutoAuth.exe --verify-tag --title "ZHKU-NetAutoAuth $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
