name: Rust GUI checks

on:
  push:
    branches: [main, 'feat/rust-gui']
    paths: ['rust-gui/**', '.github/workflows/rust-gui.yml']
  pull_request:
    paths: ['rust-gui/**', '.github/workflows/rust-gui.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path rust-gui/Cargo.toml -- --check
      - name: Check Rust code
        run: cargo clippy --locked --manifest-path rust-gui/Cargo.toml --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked --manifest-path rust-gui/Cargo.toml
