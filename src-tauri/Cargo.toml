[package]
name = "zhku-netautoauth-desktop"
version = "2.2.1"
edition = "2024"
license = "MIT"
description = "ZHKU-NetAutoAuth Fluent UI 桌面客户端"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zhku-netautoauth-gui = { path = ".." }

[features]
custom-protocol = ["tauri/custom-protocol"]
